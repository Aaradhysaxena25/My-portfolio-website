                        </span>
                      </div>
                      <h3 className="font-bold text-lg text-white mb-1">{sk.name}</h3>
                      <p className="text-xs text-slate-300 mb-4 leading-relaxed">{sk.desc}</p>
                    </div>

                    {/* Progress Bar */}
                    <div>
                      <div className="flex justify-between text-[11px] font-mono font-bold mb-1.5">
                        <span className="text-slate-400">Proficiency</span>
                        <span className="text-pink-300">{sk.level}%</span>
                      </div>
                      <div className="w-full h-2 rounded-full bg-white/10 overflow-hidden">
                        <div 
                          className={`h-full bg-gradient-to-r ${sk.color} transition-all duration-700`} 
                          style={{ width: `${sk.level}%` }}
                        />
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </section>

            <section id="projects" className="py-20 border-t border-white/10">
              <div className="flex flex-col md:flex-row md:items-end justify-between mb-12">
                <div>
                  <div className="inline-flex items-center gap-2 text-cyan-400 text-xs tracking-widest font-mono uppercase font-bold mb-2">
                    <Icon name="box" className="w-4 h-4" /> Portfolio Projects
                  </div>
                  <h2 className="text-3xl sm:text-5xl font-extrabold text-white tracking-tight">Featured Applications</h2>
                </div>

                {/* Filter buttons */}
                <div className="mt-6 md:mt-0 flex items-center gap-2 p-1.5 rounded-2xl glass-card text-xs">
                  {['all', 'react', 'mern', 'python'].map((tab) => (
                    <button
                      key={tab}
                      onClick={() => setProjectFilter(tab)}
                      className={`px-5 py-2.5 rounded-xl font-bold capitalize transition-all duration-200 ${
                        projectFilter === tab 
                          ? 'bg-gradient-to-r from-pink-500 to-purple-600 text-white shadow-md' 
                          : 'text-slate-300 hover:text-white'
                      }`}
                    >
                      {tab}
                    </button>
                  ))}
                </div>
              </div>

              {/* Projects Grid */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                {filteredProjects.map((p) => (
                  <div 
                    key={p.id} 
                    className="p-7 rounded-3xl glass-card glass-card-hover flex flex-col justify-between group"
                  >
                    <div>
                      <div className="flex items-center justify-between mb-4">
                        <span className="text-[10px] font-mono font-bold uppercase px-3 py-1 rounded-full bg-white/10 text-cyan-300 border border-white/15">
                          {p.category}
                        </span>
                        <button 
                          onClick={() => setSelectedProject(p)}
                          className="p-2 rounded-xl text-slate-300 hover:text-white hover:bg-white/15 transition-colors"
                          title="Inspect Details"
                        >
                          <Icon name="maximize-2" className="w-4 h-4" />
                        </button>
                      </div>

                      <h3 className="text-xl font-bold text-white group-hover:text-pink-300 transition-colors mb-2">
                        {p.title}
                      </h3>
                      <p className="text-slate-300 text-xs mb-6 leading-relaxed">
                        {p.shortDesc}
                      </p>

                      <div className="flex flex-wrap gap-1.5 mb-6">
                        {p.tags.map((t, idx) => (
                          <span key={idx} className="text-[10px] font-semibold px-2.5 py-1 rounded-md bg-white/10 text-slate-200 border border-white/10">
                            {t}
                          </span>
                        ))}
                      </div>
                    </div>

                    <div className="pt-4 border-t border-white/10 flex items-center justify-between text-xs font-bold">
                      <span className="text-emerald-400 font-mono text-[11px]">{p.metrics}</span>
                      <button 
                        onClick={() => setSelectedProject(p)}
                        className="inline-flex items-center gap-1 text-pink-400 hover:text-pink-300"
                      >
                        Inspect <Icon name="arrow-up-right" className="w-3.5 h-3.5" />
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </section>

            <section id="terminal" className="py-20 border-t border-white/10">
              <div className="max-w-3xl mx-auto">
                <div className="p-[2px] rounded-3xl bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-500 shadow-2xl shadow-purple-950/50">
                  <div className="rounded-[22px] bg-[#0f081c] overflow-hidden border border-white/10">
                    
                    {/* Header bar */}
                    <div className="px-5 py-3.5 bg-[#180e2b] flex items-center justify-between border-b border-white/10">
                      <div className="flex items-center space-x-2">
                        <div className="w-3.5 h-3.5 rounded-full bg-rose-500/90" />
                        <div className="w-3.5 h-3.5 rounded-full bg-amber-500/90" />
                        <div className="w-3.5 h-3.5 rounded-full bg-emerald-500/90" />
                        <span className="text-xs font-mono font-bold text-purple-200 ml-2">arad-cli@itm-gwalior:~</span>
                      </div>
                      <Icon name="terminal" className="w-4 h-4 text-purple-300" />
                    </div>

                    {/* Console Output */}
                    <div className="p-6 font-mono text-xs space-y-2.5 min-h-[220px] max-h-[300px] overflow-y-auto">
                      {terminalLogs.map((log, idx) => (
                        <div key={idx} className={`leading-relaxed ${
                          log.type === 'user' ? 'text-amber-300 font-bold' :
                          log.type === 'error' ? 'text-rose-400' :
                          log.type === 'system' ? 'text-pink-300 font-bold' : 'text-slate-200'
                        }`}>
                          {log.text}
                        </div>
                      ))}
                      <div ref={terminalEndRef} />
                    </div>

                    {/* Console Form Input */}
                    <form onSubmit={handleTerminalSubmit} className="p-4 bg-[#140b24] flex items-center border-t border-white/10">
                      <span className="text-pink-400 font-mono text-xs mr-2 font-bold">$</span>
                      <input
                        type="text"
                        value={terminalInput}
                        onChange={(e) => setTerminalInput(e.target.value)}
                        placeholder="Try 'about', 'skills', 'projects', 'education', 'contact'..."
                        className="w-full bg-transparent font-mono text-xs text-white focus:outline-none placeholder-purple-400/50"
                      />
                    </form>

                  </div>
                </div>
              </div>
            </section>

            <section id="contact" className="py-20 border-t border-white/10">
              <div className="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
                
                <div className="space-y-6">
                  <div className="inline-flex items-center gap-2 text-pink-400 text-xs tracking-widest font-mono uppercase font-bold">
                    <Icon name="mail" className="w-4 h-4" /> Get In Touch
                  </div>
                  <h2 className="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">Let's Connect</h2>
                  <p className="text-slate-300 text-xs leading-relaxed">
                    Open for internship opportunities, project collaborations, and full-stack software development conversations.
                  </p>

                  <div className="space-y-4 pt-2">
                    {/* Copy Email Button */}
                    <button 
                      onClick={copyEmail}
                      className="w-full p-4 rounded-2xl glass-card hover:border-pink-500/50 flex items-center justify-between text-slate-200 hover:text-white transition-all group"
                    >
                      <div className="flex items-center gap-4">
                        <div className="w-10 h-10 rounded-xl bg-pink-500/20 flex items-center justify-center text-pink-300 group-hover:scale-110 transition-transform">
                          <Icon name="mail" className="w-5 h-5" />
                        </div>
                        <div className="text-left">
                          <span className="text-[10px] text-slate-400 font-mono block">Direct Email</span>
                          <span className="font-mono text-xs sm:text-sm font-bold">aradsaxena@example.com</span>
                        </div>
                      </div>
                      <div className="p-2 rounded-lg bg-white/10 text-slate-300">
                        {copiedEmail ? <Icon name="check-circle-2" className="w-4 h-4 text-emerald-400" /> : <Icon name="copy" className="w-4 h-4" />}
                      </div>
                    </button>

                    <div className="flex gap-4">
                      <a 
                        href="https://github.com" 
                        target="_blank" 
                        rel="noreferrer"
                        className="flex-1 p-4 rounded-2xl glass-card hover:border-purple-500/50 flex items-center justify-center gap-3 text-slate-200 hover:text-white transition-all font-bold text-xs"
                      >
                        <Icon name="github" className="w-5 h-5 text-purple-400" /> GitHub
                      </a>
                      <a 
                        href="https://linkedin.com" 
                        target="_blank" 
                        rel="noreferrer"
                        className="flex-1 p-4 rounded-2xl glass-card hover:border-cyan-500/50 flex items-center justify-center gap-3 text-slate-200 hover:text-white transition-all font-bold text-xs"
                      >
                        <Icon name="linkedin" className="w-5 h-5 text-cyan-400" /> LinkedIn
                      </a>
                    </div>
                  </div>
                </div>

                {/* Form */}
                <div className="p-8 rounded-3xl glass-card shadow-2xl relative">
                  {contactSubmitted ? (
                    <div className="text-center py-10 space-y-4">
                      <Icon name="check-circle-2" className="w-14 h-14 text-emerald-400 mx-auto animate-bounce" />
                      <h3 className="text-2xl font-bold text-white">Message Sent!</h3>
                      <p className="text-xs text-slate-300">Thank you for reaching out. Arad will get back to you shortly.</p>
                      <button 
                        onClick={() => setContactSubmitted(false)}
                        className="px-5 py-2.5 rounded-xl bg-white/15 text-xs font-bold text-slate-100 hover:bg-white/20 transition-colors"
                      >
                        Send Another Message
                      </button>
                    </div>
                  ) : (
                    <form onSubmit={(e) => { e.preventDefault(); setContactSubmitted(true); }} className="space-y-4">
                      <div>
                        <label className="block text-xs font-mono font-bold text-slate-300 mb-1.5">Your Name</label>
                        <input 
                          required
                          type="text" 
                          placeholder="e.g. Priyanshu Sharma"
                          className="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/15 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-pink-500 transition-colors"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-mono font-bold text-slate-300 mb-1.5">Your Email</label>
                        <input 
                          required
                          type="email" 
                          placeholder="priyanshu@example.com"
                          className="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/15 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-pink-500 transition-colors"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-mono font-bold text-slate-300 mb-1.5">Message</label>
                        <textarea 
                          required
                          rows={4}
                          placeholder="Discuss a project or internship opportunity..."
                          className="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/15 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-pink-500 transition-colors resize-none"
                        />
                      </div>
                      <button 
                        type="submit"
                        className="w-full py-3.5 rounded-xl bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-500 font-bold text-xs text-white shadow-xl shadow-pink-500/25 hover:shadow-pink-500/40 hover:scale-[1.02] transition-all duration-300 flex items-center justify-center gap-2"
                      >
                        <Icon name="send" className="w-4 h-4" /> Send Message
                      </button>
                    </form>
                  )}
                </div>

              </div>
            </section>

          </main>

          {selectedProject && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="relative w-full max-w-xl p-8 rounded-3xl bg-[#120822] border border-white/20 shadow-2xl space-y-6">
                <button 
                  onClick={() => setSelectedProject(null)}
                  className="absolute top-6 right-6 p-2 rounded-full bg-white/10 hover:bg-white/20 text-slate-300 hover:text-white transition-colors"
                >
                  <Icon name="x" className="w-5 h-5" />
                </button>

                <div>
                  <span className="text-[10px] font-mono font-bold uppercase px-3 py-1 rounded-full bg-pink-500/20 text-pink-300 border border-pink-500/30">
                    {selectedProject.category}
                  </span>
                  <h3 className="text-2xl font-bold text-white mt-3">{selectedProject.title}</h3>
                </div>

                <p className="text-xs text-slate-300 leading-relaxed">
                  {selectedProject.fullDesc}
                </p>

                <div>
                  <h4 className="text-xs font-mono font-bold text-slate-400 mb-2 uppercase">Tech Architecture</h4>
                  <div className="flex flex-wrap gap-2">
                    {selectedProject.tags.map((t, idx) => (
                      <span key={idx} className="text-xs font-semibold px-3 py-1 rounded-lg bg-white/10 text-slate-200 border border-white/10">
                        {t}
                      </span>
                    ))}
                  </div>
                </div>

                <div className="pt-4 border-t border-white/10 flex items-center justify-between">
                  <a 
                    href={selectedProject.github} 
                    target="_blank" 
                    rel="noreferrer"
                    className="inline-flex items-center gap-2 text-xs font-bold text-slate-300 hover:text-white"
                  >
                    <Icon name="github" className="w-4 h-4" /> View Source
                  </a>
                  <button 
                    onClick={() => setSelectedProject(null)}
                    className="px-5 py-2 rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 text-white text-xs font-bold hover:opacity-90 transition-opacity"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          <footer className="border-t border-white/10 py-8 text-center text-xs text-slate-400">
            <p>© {new Date().getFullYear()} Arad Saxena. Computer Science Undergraduate at ITM Gwalior (Affiliated with RGPV Bhopal).</p>
          </footer>

        </div>
      );
    }

    /* Mount React Application */
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
